# Feishu bot notification. The secret may be a full webhook URL or only the token after hook/.

name: Feishu Notify
description: Send a Feishu card in a shared format

inputs:
  webhook_token:
    description: Full Feishu webhook URL, or the token after hook/
    required: true
  title:
    description: Notification title
    required: true
  description:
    description: Notification body. Feishu Markdown is supported.
    required: true
  link_text:
    description: Button label
    required: true
  link_url:
    description: Button link
    required: true
  status:
    description: success, warning, error, or info
    required: false
    default: info

runs:
  using: composite
  steps:
    - name: Send Feishu notification
      shell: bash
      env:
        FEISHU_WEBHOOK_TOKEN: ${{ inputs.webhook_token }}
        FEISHU_TITLE: ${{ inputs.title }}
        FEISHU_DESCRIPTION: ${{ inputs.description }}
        FEISHU_LINK_TEXT: ${{ inputs.link_text }}
        FEISHU_LINK_URL: ${{ inputs.link_url }}
        FEISHU_STATUS: ${{ inputs.status }}
      run: |
        set -euo pipefail
        if [ -z "${FEISHU_WEBHOOK_TOKEN}" ]; then
          echo "::error::Missing GitHub secret FEISHU_WEBHOOK_TOKEN"
          exit 1
        fi
        case "$FEISHU_WEBHOOK_TOKEN" in
          https://*) WEBHOOK="$FEISHU_WEBHOOK_TOKEN" ;;
          *) WEBHOOK="https://open.feishu.cn/open-apis/bot/v2/hook/${FEISHU_WEBHOOK_TOKEN}" ;;
        esac
        case "$FEISHU_STATUS" in
          success) TEMPLATE="green" ;;
          warning) TEMPLATE="orange" ;;
          error) TEMPLATE="red" ;;
          *) TEMPLATE="blue" ;;
        esac
        PAYLOAD=$(jq -n \
          --arg title "$FEISHU_TITLE" \
          --arg template "$TEMPLATE" \
          --arg desc "$FEISHU_DESCRIPTION" \
          --arg link_text "$FEISHU_LINK_TEXT" \
          --arg link_url "$FEISHU_LINK_URL" \
          '{
            msg_type: "interactive",
            card: {
              header: {
                title: {tag: "plain_text", content: $title},
                template: $template
              },
              elements: [
                {tag: "div", text: {tag: "lark_md", content: $desc}},
                {tag: "action", actions: [{tag: "button", text: {tag: "plain_text", content: $link_text}, type: "primary", url: $link_url}]}
              ]
            }
          }')
        RESPONSE=$(curl -sS -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD")
        echo "$RESPONSE"
        CODE=$(echo "$RESPONSE" | jq -r '.code // .StatusCode // 1')
        if [ "$CODE" != "0" ]; then
          echo "::error::Feishu notification failed"
          exit 1
        fi
