name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - name: Install Python with Tk
        run: brew install python@3.11
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build app and disk image
        run: |
          set -euo pipefail
          echo "$(brew --prefix python@3.11)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix python@3.11)/bin:$PATH"
          python3.11 -c "import tkinter"
          chmod +x build.sh
          ./build.sh
      - name: Smoke-test packaged app
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix python@3.11)/bin:$PATH"
          executable="dist/Tripo-Echo3D-Bridge.app/Contents/MacOS/Tripo-Echo3D-Bridge"
          file "$executable"
          codesign --verify --deep --strict dist/Tripo-Echo3D-Bridge.app
          "$executable" > /tmp/tripo-echo3d-bridge.log 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          if ! python3.11 - <<'PY'
          import asyncio
          import json
          import socket
          import time

          from websockets.asyncio.client import connect

          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 60710), 1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("packaged app did not listen on 60710")

          async def main():
              async with connect("ws://127.0.0.1:60710/", origin="null") as socket:
                  await socket.send(json.dumps({
                      "type": "handshake",
                      "payload": {
                          "protocolVersion": "1.1.0",
                          "clientName": "macOS package smoke test",
                      },
                  }))
                  response = json.loads(await asyncio.wait_for(socket.recv(), 8))
                  assert response["type"] == "handshake_ack", response
                  assert response["payload"]["success"] is True

          asyncio.run(main())
          PY
          then
            echo "---- packaged app log ----"
            cat /tmp/tripo-echo3d-bridge.log || true
            exit 1
          fi
          kill "$bridge_pid" || true
          wait "$bridge_pid" || true
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: Tripo-Echo3D-Bridge-macOS-${{ matrix.arch }}
          path: |
            dist/Tripo-Echo3D-Bridge-macOS-${{ matrix.arch }}.zip
            dist/Tripo-Echo3D-Bridge-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0
