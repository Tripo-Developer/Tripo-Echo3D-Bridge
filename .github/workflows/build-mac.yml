name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python with Tk
        run: brew install python@3.11
      - name: Build app
        run: |
          echo "$(brew --prefix python@3.11)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix python@3.11)/bin:$PATH"
          python3.11 -c "import tkinter"
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tripo-Echo3D-Bridge-mac
          path: dist/Tripo-Echo3D-Bridge-mac.zip
          if-no-files-found: error
