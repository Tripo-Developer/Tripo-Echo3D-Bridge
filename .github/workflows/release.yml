# Manually publish Echo3D Bridge packages for Windows and macOS.
# The Windows zip contains only Tripo-Echo3D-Bridge.exe and version.txt, which the app installs as an update.
# macOS builds arm64 and x86_64 disk images, then packs them into one zip. That zip is not an automatic update.

name: Publish Release

on:
  workflow_dispatch:
    inputs:
      published_version:
        description: Latest published tag, with a v. Enter none when nothing is published.
        required: true
        type: string
        default: "v1.1.0"
      source_version:
        description: Source version, without a v.
        required: true
        type: string
        default: "1.1.0"
      release_version:
        description: Release tag, with a v. It must match the source version.
        required: true
        type: string
        default: "v1.1.0"
      confirm_replace:
        description: Delete the existing tag and replace the Release. Leave this unchecked when the tag does not exist.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Show current and release versions
        id: version
        env:
          FORM_PUBLISHED: ${{ inputs.published_version }}
          FORM_SOURCE: ${{ inputs.source_version }}
          FORM_RELEASE: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          SOURCE="$(python .github/scripts/release_package.py version)"
          TAG="$(python .github/scripts/release_package.py tag)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$FORM_SOURCE" != "$SOURCE" ]; then
            echo "::error::Source version must be ${SOURCE}"
            exit 1
          fi
          if [ "$FORM_RELEASE" != "$TAG" ]; then
            echo "::error::Release tag must be ${TAG}"
            exit 1
          fi
          CURRENT="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$CURRENT" ]; then
            CURRENT="none"
          fi
          {
            echo "## Version"
            echo ""
            echo "The source version has no v. The tag does. \`${SOURCE}\` and \`${TAG}\` are the same version."
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Published tag | ${CURRENT} |"
            echo "| Source version | ${SOURCE} |"
            echo "| Release tag | ${TAG} |"
            if [ "$CURRENT" = "$TAG" ]; then
              echo ""
              echo "${TAG} already exists. It is kept unless replacement is confirmed."
            fi
            if [ "$FORM_PUBLISHED" != "$CURRENT" ]; then
              echo ""
              echo "The form says ${FORM_PUBLISHED}. The published tag is ${CURRENT}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm replacing an existing tag
        env:
          CONFIRM_REPLACE: ${{ inputs.confirm_replace }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python .github/scripts/release_package.py check
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [ "$CONFIRM_REPLACE" != "true" ]; then
              echo "::error::Tag ${RELEASE_TAG} already exists. Check replace and run again to overwrite it."
              exit 1
            fi
            echo "Confirmed replacement of ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run non-desktop tests
        run: python -m unittest tests.test_auto_update tests.test_protocol tests.test_cloud_receiver tests.test_error_details tests.test_loopback_flow tests.test_release_package -v

  build:
    name: Build Windows package
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run desktop tests
        run: python -m unittest tests.test_desktop_ui tests.test_desktop_runtime -v
      - name: Build executable
        shell: pwsh
        run: ./build.ps1
      - name: Package release zip
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: python .github/scripts/release_package.py pack --exe dist/Tripo-Echo3D-Bridge.exe
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: echo3d-release-windows
          path: release-assets/*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Install Python with Tk
        run: brew install python@3.11
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build app and disk image
        run: |
          set -euo pipefail
          echo "$(brew --prefix python@3.11)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix python@3.11)/bin:$PATH"
          python3.11 -c "import tkinter"
          chmod +x build.sh
          ./build.sh
      - name: Smoke-test packaged app
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix python@3.11)/bin:$PATH"
          executable="dist/Tripo-Echo3D-Bridge.app/Contents/MacOS/Tripo-Echo3D-Bridge"
          file "$executable"
          codesign --verify --deep --strict dist/Tripo-Echo3D-Bridge.app
          "$executable" > /tmp/tripo-echo3d-bridge.log 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          if ! python3.11 - <<'PY'
          import asyncio
          import json
          import socket
          import time

          from websockets.asyncio.client import connect

          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 60710), 1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("packaged app did not listen on 60710")

          async def main():
              async with connect("ws://127.0.0.1:60710/", origin="null") as socket:
                  await socket.send(json.dumps({
                      "type": "handshake",
                      "payload": {
                          "protocolVersion": "1.1.0",
                          "clientName": "macOS package smoke test",
                      },
                  }))
                  response = json.loads(await asyncio.wait_for(socket.recv(), 8))
                  assert response["type"] == "handshake_ack", response
                  assert response["payload"]["success"] is True

          asyncio.run(main())
          PY
          then
            echo "---- packaged app log ----"
            cat /tmp/tripo-echo3d-bridge.log || true
            exit 1
          fi
          kill "$bridge_pid" || true
          wait "$bridge_pid" || true
          trap - EXIT
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: echo3d-release-macos-${{ matrix.arch }}
          path: |
            dist/Tripo-Echo3D-Bridge-macOS-${{ matrix.arch }}.zip
            dist/Tripo-Echo3D-Bridge-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [verify, build, build-macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: echo3d-release-windows
          path: release-assets
      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: echo3d-release-macos-*
          path: artifacts/macos
      - name: Assemble macOS release zip
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          arm=$(find artifacts/macos -type f -name 'Tripo-Echo3D-Bridge-macOS-arm64.dmg' -print -quit)
          intel=$(find artifacts/macos -type f -name 'Tripo-Echo3D-Bridge-macOS-x86_64.dmg' -print -quit)
          test -n "$arm"
          test -n "$intel"
          test "$(stat -c%s "$arm")" -gt 1000000
          test "$(stat -c%s "$intel")" -gt 1000000
          mkdir -p dist/cdn-macos release-assets
          cp "$arm" "$intel" dist/cdn-macos/
          python3 - <<'PY'
          from pathlib import Path
          Path("dist/cdn-macos/README.md").write_text(
              "# Tripo Echo3D Bridge for macOS\n\n"
              "Open the disk image for this Mac:\n\n"
              "- Apple silicon: Tripo-Echo3D-Bridge-macOS-arm64.dmg\n"
              "- Intel: Tripo-Echo3D-Bridge-macOS-x86_64.dmg\n\n"
              "Drag Tripo Echo3D Bridge to Applications. The first launch may require "
              "Control-click and then Open, because the app is not notarized.\n",
              encoding="utf-8",
          )
          PY
          (
            cd dist/cdn-macos
            zip -q -r -y "../../release-assets/Tripo3d_echo3d_Bridge-mac-${RELEASE_TAG}.zip" \
              Tripo-Echo3D-Bridge-macOS-arm64.dmg \
              Tripo-Echo3D-Bridge-macOS-x86_64.dmg \
              README.md
          )
          python3 .github/scripts/release_package.py stage-mac \
            --archive "release-assets/Tripo3d_echo3d_Bridge-mac-${RELEASE_TAG}.zip"
      - name: Publish complete GitHub Release
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          CONFIRM_REPLACE: ${{ inputs.confirm_replace }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [ "$CONFIRM_REPLACE" != "true" ]; then
              echo "::error::Tag ${RELEASE_TAG} already exists and replacement was not confirmed"
              exit 1
            fi
            echo "Replacing existing release $RELEASE_TAG"
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag
            else
              git push origin ":refs/tags/$RELEASE_TAG"
            fi
          fi
          gh release create "$RELEASE_TAG" --target "$(git rev-parse HEAD)" --title "$RELEASE_TAG" --generate-notes --draft
          gh release upload "$RELEASE_TAG" release-assets/*.zip
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published $RELEASE_TAG with Windows and macOS packages. Run Upload Release to distribute." >> "$GITHUB_STEP_SUMMARY"
